plugins {
    id 'com.android.application'
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "com.spgrvl.packagetracker"
        minSdk = 24
        targetSdk = 37
        versionCode = 104
        versionName = "2.5.3"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    namespace = 'com.spgrvl.packagetracker'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for unit tests (android.jar only has stubs)
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    // jsoup HTML parser library @ https://jsoup.org/
    implementation 'org.jsoup:jsoup:1.23.2'
    // Google play services vision for barcode scanning (Note: Vision API is deprecated, consider ML Kit)
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    // OkHttp library for requests
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // WorkManager for managing background tasks
    implementation "androidx.work:work-runtime:2.12.0"
}
